name: my-bloody-sonar
on:
  push:
    branches:
      - develop
      - feature/*
      - main
    tags:
      - 'v*'
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
  release:
    types: [ published ]

env:
  push_to_registry: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  getVersion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)
          echo "Latest tag: $LATEST_TAG"
          echo "latest_tag=${LATEST_TAG#v}" >> $GITHUB_OUTPUT

      - name: Resolve closest community version
        id: community_version
        run: |
          # Pick the versioned community tag with the highest build number.
          COMMUNITY_VERSION=$(curl -fsSL \
            "https://registry.hub.docker.com/v2/repositories/library/sonarqube/tags/?page_size=50&name=community" \
            | jq -r '.results[].name
                     | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+-community$"))' \
            | sort -t. -k4 -V | tail -1)
          echo "community_version=${COMMUNITY_VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved community version: ${COMMUNITY_VERSION}"

    outputs:
      version: ${{ steps.get_tag.outputs.latest_tag }}
      community_version: ${{ steps.community_version.outputs.community_version }}

  test:
    needs: getVersion
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [ developer, enterprise ]
        version: [ "${{ needs.getVersion.outputs.version }}" ]
        include:
          - release: community
            from_tag: "${{ needs.getVersion.outputs.community_version }}"


    steps:
      - name: Setup BATS
        run: sudo npm install -g bats

      - uses: actions/checkout@v5

      - name: test test-${{ matrix.from_tag || format('{0}-{1}', matrix.version, matrix.release) }}
        run: make test VERSION=${{ matrix.from_tag || format('{0}-{1}', matrix.version, matrix.release) }}

  publish-images:
    needs: [ test, getVersion ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        release: [ developer, enterprise ]
        version: [ "${{ needs.getVersion.outputs.version }}" ]
        include:
          - release: community
            from_tag: "${{ needs.getVersion.outputs.community_version }}"

#    if: ${{ github.event.release.published == true }}
    steps:
      - uses: actions/checkout@v5

      - name: Login to Packages Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/my-bloody-sonar

          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=${{ matrix.from_tag || format('{0}-{1}', matrix.version, matrix.release) }}
            type=sha

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          push: ${{ env.push_to_registry }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FROM_TAG=${{ matrix.from_tag || format('{0}-{1}', matrix.version, matrix.release) }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
